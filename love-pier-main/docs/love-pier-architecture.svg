<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaf7"/><stop offset="1" stop-color="#f5efe7"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#38291d" flood-opacity=".10"/></filter>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3c7658"/></marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c75b85"/></marker>
    <style>
      .title{font:700 34px Inter,Arial,sans-serif;fill:#2f251e}.subtitle{font:400 15px Inter,Arial,sans-serif;fill:#75675c}.section{font:700 22px Inter,Arial,sans-serif;fill:#342921}.boxTitle{font:700 17px Inter,Arial,sans-serif;fill:#33281f}.body{font:400 14px Inter,Arial,sans-serif;fill:#54483f}.small{font:400 12px Inter,Arial,sans-serif;fill:#6f6258}.pill{font:700 12px Inter,Arial,sans-serif;letter-spacing:1px}.flow{fill:none;stroke:#3c7658;stroke-width:3;marker-end:url(#arrowGreen)}.external{fill:none;stroke:#c75b85;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrowPink)}
    </style>
  </defs>
  <rect width="1600" height="960" fill="url(#bg)"/>
  <text x="800" y="53" text-anchor="middle" class="title">LOVE PIER — Beach Cafe Platform Architecture</text>
  <text x="800" y="80" text-anchor="middle" class="subtitle">Architecture derived from the current repository · Customer web, LINE LIFF, ordering, membership and backoffice</text>

  <!-- External services -->
  <rect x="40" y="110" width="315" height="740" rx="22" fill="#fae8ee" stroke="#d783a2" stroke-width="2" filter="url(#shadow)"/>
  <text x="198" y="147" text-anchor="middle" class="section">External Services</text>
  <g filter="url(#shadow)"><rect x="68" y="177" width="259" height="102" rx="14" fill="#fff5f8" stroke="#d783a2"/><text x="198" y="208" text-anchor="middle" class="boxTitle">LINE Platform</text><text x="198" y="233" text-anchor="middle" class="body">LIFF Login · Messaging API</text><text x="198" y="255" text-anchor="middle" class="small">Customer profile · OA notifications</text></g>
  <g filter="url(#shadow)"><rect x="68" y="304" width="259" height="90" rx="14" fill="#fff5f8" stroke="#d783a2"/><text x="198" y="338" text-anchor="middle" class="boxTitle">PromptPay</text><text x="198" y="365" text-anchor="middle" class="body">Dynamic QR payment</text></g>
  <g filter="url(#shadow)"><rect x="68" y="419" width="259" height="100" rx="14" fill="#fff5f8" stroke="#d783a2"/><text x="198" y="452" text-anchor="middle" class="boxTitle">Webhook Gateway</text><text x="198" y="477" text-anchor="middle" class="body">Shared-secret protected proxy</text><text x="198" y="499" text-anchor="middle" class="small">SlipOK slip verification provider</text></g>
  <g filter="url(#shadow)"><rect x="68" y="544" width="259" height="90" rx="14" fill="#fff5f8" stroke="#d783a2"/><text x="198" y="578" text-anchor="middle" class="boxTitle">Google Routes API</text><text x="198" y="605" text-anchor="middle" class="body">Driving distance &amp; delivery radius</text></g>
  <g filter="url(#shadow)"><rect x="68" y="659" width="259" height="90" rx="14" fill="#fff5f8" stroke="#d783a2"/><text x="198" y="693" text-anchor="middle" class="boxTitle">Email / Google Sheets</text><text x="198" y="720" text-anchor="middle" class="body">SMTP forms · optional webhook</text></g>
  <g filter="url(#shadow)"><rect x="68" y="774" width="259" height="52" rx="14" fill="#fff5f8" stroke="#d783a2"/><text x="198" y="806" text-anchor="middle" class="boxTitle">Vercel Hosting</text></g>

  <!-- clients -->
  <rect x="390" y="110" width="1170" height="182" rx="22" fill="#e2f0f9" stroke="#6c9fbd" stroke-width="2" filter="url(#shadow)"/>
  <text x="975" y="145" text-anchor="middle" class="section">Clients</text>
  <g><rect x="420" y="167" width="260" height="78" rx="13" fill="#f1f8fc" stroke="#6c9fbd"/><text x="550" y="197" text-anchor="middle" class="boxTitle">Public Website</text><text x="550" y="222" text-anchor="middle" class="body">Home · Menu · Events · Gallery</text></g>
  <g><rect x="700" y="167" width="260" height="78" rx="13" fill="#f1f8fc" stroke="#6c9fbd"/><text x="830" y="197" text-anchor="middle" class="boxTitle">Ordering &amp; Booking</text><text x="830" y="222" text-anchor="middle" class="body">Delivery · Preorder · Reservation</text></g>
  <g><rect x="980" y="167" width="260" height="78" rx="13" fill="#f1f8fc" stroke="#6c9fbd"/><text x="1110" y="197" text-anchor="middle" class="boxTitle">LINE LIFF</text><text x="1110" y="222" text-anchor="middle" class="body">Member ID · Profile · Chat flow</text></g>
  <g><rect x="1260" y="167" width="270" height="78" rx="13" fill="#f1f8fc" stroke="#6c9fbd"/><text x="1395" y="197" text-anchor="middle" class="boxTitle">Staff Backoffice</text><text x="1395" y="222" text-anchor="middle" class="body">/admin · Orders · CMS · Scanner</text></g>
  <text x="975" y="272" text-anchor="middle" class="small">Next.js 16 · React 19 · TypeScript + JavaScript · Tailwind CSS 4 · shadcn/radix admin components</text>

  <!-- application -->
  <rect x="390" y="330" width="1170" height="332" rx="22" fill="#e6f3e8" stroke="#6ca477" stroke-width="2" filter="url(#shadow)"/>
  <text x="975" y="366" text-anchor="middle" class="section">Love Pier Next.js Application</text>
  <g><rect x="420" y="397" width="255" height="108" rx="14" fill="#f1faf2" stroke="#6ca477"/><text x="548" y="429" text-anchor="middle" class="boxTitle">Public Pages</text><text x="548" y="455" text-anchor="middle" class="body">Pages Router · SSR / SSG</text><text x="548" y="478" text-anchor="middle" class="small">Marketing, menu, promotions, events</text></g>
  <g><rect x="695" y="397" width="255" height="108" rx="14" fill="#f1faf2" stroke="#6ca477"/><text x="823" y="429" text-anchor="middle" class="boxTitle">Commerce APIs</text><text x="823" y="455" text-anchor="middle" class="body">Orders · Customers · Booking</text><text x="823" y="478" text-anchor="middle" class="small">Delivery, preorder, QR, slip status</text></g>
  <g><rect x="970" y="397" width="255" height="108" rx="14" fill="#f1faf2" stroke="#6ca477"/><text x="1098" y="429" text-anchor="middle" class="boxTitle">Admin App</text><text x="1098" y="455" text-anchor="middle" class="body">App Router · Server Actions</text><text x="1098" y="478" text-anchor="middle" class="small">Menu, orders, members, content</text></g>
  <g><rect x="1245" y="397" width="285" height="108" rx="14" fill="#f1faf2" stroke="#6ca477"/><text x="1388" y="429" text-anchor="middle" class="boxTitle">Authentication</text><text x="1388" y="455" text-anchor="middle" class="body">Supabase Auth for staff</text><text x="1388" y="478" text-anchor="middle" class="small">LINE access-token verification for LIFF</text></g>
  <g><rect x="515" y="535" width="360" height="94" rx="14" fill="#d7eddd" stroke="#57916a"/><text x="695" y="568" text-anchor="middle" class="boxTitle">Domain &amp; Business Logic</text><text x="695" y="593" text-anchor="middle" class="body">Orders · Loyalty · Tiers · Reservations</text><text x="695" y="614" text-anchor="middle" class="small">Pricing · inventory · customer journeys</text></g>
  <g><rect x="925" y="535" width="440" height="94" rx="14" fill="#d7eddd" stroke="#57916a"/><text x="1145" y="568" text-anchor="middle" class="boxTitle">Integrations &amp; Media Processing</text><text x="1145" y="593" text-anchor="middle" class="body">LINE · PromptPay · Maps · SMTP · Gateway</text><text x="1145" y="614" text-anchor="middle" class="small">Sharp image conversion · upload controls</text></g>

  <!-- storage -->
  <rect x="390" y="700" width="1170" height="150" rx="22" fill="#faefd9" stroke="#c5933f" stroke-width="2" filter="url(#shadow)"/>
  <text x="975" y="736" text-anchor="middle" class="section">Data &amp; Storage</text>
  <g><rect x="430" y="758" width="520" height="68" rx="14" fill="#fff8e9" stroke="#c5933f"/><text x="690" y="786" text-anchor="middle" class="boxTitle">Supabase PostgreSQL + Drizzle ORM</text><text x="690" y="809" text-anchor="middle" class="small">Orders · customers · menu · rewards · events · settings · reservations</text></g>
  <g><rect x="990" y="758" width="530" height="68" rx="14" fill="#fff8e9" stroke="#c5933f"/><text x="1255" y="786" text-anchor="middle" class="boxTitle">Supabase Storage</text><text x="1255" y="809" text-anchor="middle" class="small">Menu images · promotion assets · optimized WebP uploads</text></g>

  <!-- flows -->
  <path d="M975 292 L975 326" class="flow"/>
  <path d="M695 629 L695 754" class="flow"/>
  <path d="M1145 629 L1255 754" class="flow"/>
  <path d="M390 232 C365 232 365 226 327 226" class="external"/>
  <path d="M695 470 C505 470 430 349 327 349" class="external"/>
  <path d="M925 582 C600 582 520 469 327 469" class="external"/>
  <path d="M925 582 C600 582 500 589 327 589" class="external"/>
  <path d="M925 600 C620 650 500 704 327 704" class="external"/>

  <!-- legend -->
  <rect x="0" y="884" width="1600" height="76" fill="#eee9e2"/>
  <text x="50" y="918" class="pill" fill="#4d88aa">BLUE  CLIENTS</text><text x="205" y="918" class="pill" fill="#4e8b5f">GREEN  APP</text><text x="355" y="918" class="pill" fill="#c65d84">PINK  EXTERNAL</text><text x="540" y="918" class="pill" fill="#b57d26">ORANGE  DATA</text>
  <line x1="750" y1="914" x2="805" y2="914" stroke="#3c7658" stroke-width="3" marker-end="url(#arrowGreen)"/><text x="820" y="919" class="small">Internal flow</text>
  <line x1="960" y1="914" x2="1015" y2="914" stroke="#c75b85" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrowPink)"/><text x="1030" y="919" class="small">External API</text>
  <text x="1210" y="919" class="small">All production traffic: HTTPS / TLS</text>
  <text x="1550" y="944" text-anchor="end" class="small">Source: love-pier-main + webhook-gateway · 26 Aug 2026</text>
</svg>
